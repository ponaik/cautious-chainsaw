spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # UserService routes
            - id: userservice-users
              uri: ${USERSERVICE_BASEURL}
              predicates:
                - Path=/api/users/**

            - id: userservice-cards
              uri: ${USERSERVICE_BASEURL}
              predicates:
                - Path=/api/cards/**

            # OrderService routes
            - id: orderservice
              uri: ${ORDERSERVICE_BASEURL}
              predicates:
                - Path=/api/orders/**

            - id: orderservice-open-api
              uri: ${ORDERSERVICE_BASEURL}
              predicates:
                - Path=/orders/v3/api-docs
              filters:
                - StripPrefix=1

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: gateway-service
        url: /v3/api-docs
      - name: order-service
        url: /orders/v3/api-docs

network:
  user-service:
    base-url: ${USERSERVICE_BASEURL}
  auth-service:
    base-url: ${KEYCLOAK_BASEURL}
    service-client:
      id: ${GATEWAY_CLIENT_ID}
      secret: ${GATEWAY_CLIENT_SECRET}
    authentication-client:
      id: ${AUTH_CLIENT_ID}
      secret: ${AUTH_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: read-only

server:
  port: 8081
  error:
    include-message: always


logging:
  level:
    com.intern.gateway.client: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: INFO
    reactor.netty: INFO
